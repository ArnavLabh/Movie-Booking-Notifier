name: Booking Notifier

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking BookMyShow"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: booking-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            python notifier.py --test-email
          else
            python notifier.py
          fi

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "booking-notifier-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update notifier state"
            git push
          else
            echo "No state changes to commit."
          fi
